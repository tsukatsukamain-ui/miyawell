<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIYAWELL</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;600;700&display=swap">
<style>
  :root{
    --stone-warm:#E2DBC9;
    --paper:#F5F2E9;
    --ink:#2B2A22;
    --ink-soft:#5A5748;
    --moss:#4C6B4E;
    --moss-deep:#334A35;
    --amber:#B8863C;
    --line:rgba(43,42,34,0.14);
    --card:#FFFFFF;
    --shadow:0 1px 2px rgba(43,42,34,0.06), 0 8px 24px rgba(43,42,34,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --stone-warm:#282C22; --paper:#1C1F19; --ink:#EDE9DC; --ink-soft:#B7B1A0;
      --moss:#8FB08F; --moss-deep:#6E9270; --amber:#D9A85C;
      --line:rgba(237,233,220,0.14); --card:#262A21;
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.3);
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;padding-inline:20px;}
  h1,h2,.brand{font-family:"Zen Old Mincho","Noto Serif JP",serif;text-wrap:balance;}
  .wrap{max-width:1080px;margin-inline:auto;}
  nav{display:flex;align-items:center;justify-content:space-between;padding-block:22px;flex-wrap:wrap;gap:12px;}
  .brand{font-size:20px;font-weight:600;letter-spacing:0.08em;}
  #auth-area{display:flex;align-items:center;gap:12px;}
  .user-name{font-size:13px;color:var(--ink-soft);}
  header.hero{padding-block:40px 48px;}
  h1{font-size:clamp(28px,4.6vw,42px);line-height:1.3;font-weight:600;margin:0 0 16px;}
  .sub{font-size:15px;line-height:1.9;color:var(--ink-soft);max-width:56ch;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:8px;font-size:13.5px;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid transparent;font-family:"Zen Kaku Gothic New",sans-serif;}
  .btn-sm{padding:8px 16px;font-size:13px;}
  .btn-primary{background:var(--moss);color:var(--paper);}
  .btn-primary:hover{background:var(--moss-deep);}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--moss);color:var(--moss);}
  .btn-link{background:none;border:none;color:var(--ink-soft);font-size:12px;text-decoration:underline;cursor:pointer;padding:0;}
  section{padding-block:40px;border-top:1px solid var(--line);}
  .section-head h2{font-size:22px;margin:0 0 8px;font-weight:600;}
  .section-head p{color:var(--ink-soft);font-size:14px;margin:0;}
  .event-list{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:20px;}
  .event-row{display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:center;padding-block:16px;border-bottom:1px solid var(--line);}
  @media (max-width:640px){.event-row{grid-template-columns:1fr;text-align:left;}}
  .event-date{font-size:12px;color:var(--ink-soft);}
  .event-date strong{display:block;font-size:18px;color:var(--ink);font-family:"Zen Old Mincho",serif;}
  .event-name{font-size:15px;font-weight:600;}
  .event-place{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .event-action{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  @media (max-width:640px){.event-action{align-items:flex-start;}}
  .event-status{font-size:11px;letter-spacing:0.04em;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap;}
  .event-status.open{color:var(--moss-deep);border-color:var(--moss);background:color-mix(in srgb, var(--moss) 12%, transparent);}
  .error{color:#B5453A;font-size:13px;}
  footer{padding-block:32px 48px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-soft);}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="brand">MIYAWELL</div>
    <div id="auth-area"></div>
  </nav>

  <header class="hero">
    <h1>速く走ることより、気持ちよく過ごすこと。</h1>
    <p class="sub">宇都宮発のウェルネスランニングコミュニティ。Googleアカウントでログインすると、参加予定のイベントが管理でき、前日にリマインドメールが届きます。</p>
  </header>

  <section id="events">
    <div class="section-head">
      <h2>開催予定のイベント</h2>
      <p>参加するにはログインしてください。</p>
    </div>
    <div id="event-list" class="event-list">
      <p class="event-place">読み込み中...</p>
    </div>
  </section>

  <footer>MIYAWELL — Utsunomiya, Japan</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://js.stripe.com/v3/"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
